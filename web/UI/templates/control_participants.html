<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISM Lab | Control Participants</title>
  <link rel="icon" href="http://localhost:9992/static/icons/favicon.png">
  <link rel="stylesheet" href="http://localhost:9992/static/css/control_participants.css">
</head>
<body>
  <div class="stars"></div>
  <div class="nebula"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div class="page-shell">
    <header class="page-header">
      <a class="brand" href="http://localhost:9992/" aria-label="ISM Lab Home">
        <div class="logo" aria-hidden="true"></div>
        <div class="title">
          <strong>Interstellar Medium (ISM) Lab</strong>
          <span>Participants control</span>
        </div>
      </a>
      <div class="panel-actions">
        <div class="session-chip"><span class="dot" aria-hidden="true"></span>Active session</div>
        <button id="logout-button" class="logout-button" type="button">Logout</button>
      </div>
    </header>

    <main class="page-layout">
      <aside class="tools-panel" aria-label="Participant controls">
        <a class="toolbox-button" href="http://localhost:9992/control/panel/">Go back to control panel</a>
      </aside>
      <section class="content-panel" aria-labelledby="participants-title">
        <div class="section-heading">
          <p class="kicker">Control panel</p>
          <h1 id="participants-title">Participants by event</h1>
        </div>
        <div id="participants-list" class="scroll-list" aria-live="polite">
          <article class="data-card loading-card"><h2>Loading events</h2></article>
        </div>
      </section>
    </main>
  </div>

  <div id="participant-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="participant-modal-title">
    <form id="participant-form" class="modal-card">
      <div class="modal-head">
        <h2 id="participant-modal-title">Create participant</h2>
        <button class="small-action subtle" type="button" data-close-modal>Close</button>
      </div>
      <label>First name<input name="first_name" type="text" required></label>
      <label>Last name<input name="last_name" type="text" required></label>
      <label>Middle name<input name="middle_name" type="text"></label>
      <label>Organization<input name="organization" type="text"></label>
      <label>Attending event<input name="attending_event" type="text" required></label>
      <div class="form-actions">
        <button class="small-action primary-tool" type="submit">Save participant</button>
        <button class="small-action subtle" type="button" data-close-modal>Cancel</button>
      </div>
    </form>
  </div>

  <script src="http://localhost:9992/static/js/build_control_participants.js"></script>
</body>
</html>
