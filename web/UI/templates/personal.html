<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISM Lab | Personal Account</title>
  <link rel="icon" href="http://localhost:9992/static/icons/favicon.png">
  <link rel="stylesheet" href="http://localhost:9992/static/css/personal.css">
</head>
<body>
  <div class="stars"></div>
  <div class="nebula"></div>
  <div class="page-shell">
    <header class="page-header">
      <a class="brand" href="http://localhost:9992/control/panel/"><div class="logo" aria-hidden="true"></div><div class="title"><strong>ISM Lab</strong><span>Personal account</span></div></a>
      <div class="panel-actions"><div id="role-chip" class="session-chip"><span class="dot" aria-hidden="true"></span>Loading account</div></div>
    </header>
    <main class="page-layout">
      <aside class="tools-panel" aria-label="Account controls"><a class="toolbox-button" href="http://localhost:9992/control/panel/">Go back to control panel</a></aside>
      <section class="content-panel" aria-labelledby="account-title">
        <div class="section-heading"><p class="kicker">Control panel</p><h1 id="account-title">Personal account</h1></div>
        <form id="profile-form" class="modal-card"><h2>Personal information</h2><div id="profile-fields" class="form-grid"></div><div class="form-actions"><button class="toolbox-button primary-tool" type="submit">Update information</button></div></form>
        <form id="password-form" class="modal-card account-form"><h2>Password</h2><div class="form-grid"><label>Password<input name="password" type="password" required></label><label>Repeat password<input name="repeat_password" type="password" required></label></div><div class="form-actions"><button class="toolbox-button primary-tool" type="submit">Update password</button></div></form>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="http://localhost:9992/static/js/build_personal.js"></script>
</body>
</html>
