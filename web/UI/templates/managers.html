<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISM Lab | Managers</title>
  <link rel="icon" href="http://localhost:9992/static/icons/favicon.png">
  <link rel="stylesheet" href="http://localhost:9992/static/css/managers.css">
</head>
<body>
  <div class="stars"></div>
  <div class="nebula"></div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div class="manager-shell">
    <header class="manager-header">
      <a class="brand" href="http://localhost:9992/" aria-label="ISM Lab Home">
        <div class="logo" aria-hidden="true"></div>
        <div class="title">
          <strong>Interstellar Medium (ISM) Lab</strong>
          <span>Manager accounts</span>
        </div>
      </a>

      <div class="panel-actions">
        <div class="session-chip">
          <span class="dot" aria-hidden="true"></span>
          Active session
        </div>
        <button id="logout-button" class="logout-button" type="button">Logout</button>
      </div>
    </header>

    <main class="manager-layout">
      <aside class="manager-tools" aria-label="Manager controls">
        <button id="show-create-form" class="toolbox-button primary-tool" type="button">Create new manager</button>
        <a class="toolbox-button" href="http://localhost:9992/control/panel/">Go back to control panel</a>

        <form id="create-manager-form" class="manager-form hidden" autocomplete="off">
          <h2>Create manager</h2>
          <label>
            Login
            <input name="manager_login" type="text" required>
          </label>
          <label>
            First name
            <input name="manager_firstname" type="text" required>
          </label>
          <label>
            Last name
            <input name="manager_lastname" type="text" required>
          </label>
          <label>
            Email
            <input name="manager_email" type="email" required>
          </label>
          <label>
            Password
            <input name="manager_password" type="password" required>
          </label>
          <label>
            Reapet password
            <input name="manager_repeat_password" type="password" required>
          </label>
          <div class="form-actions">
            <button class="small-action" type="submit">Create</button>
            <button class="small-action subtle" type="button" data-close-create>Cancel</button>
          </div>
        </form>
      </aside>

      <section class="managers-panel" aria-labelledby="managers-title">
        <div class="section-heading">
          <p class="kicker">Control panel</p>
          <h1 id="managers-title">Managers</h1>
        </div>

        <div id="managers-list" class="managers-list" aria-live="polite">
          <article class="manager-card loading-card">
            <h2>Loading managers</h2>
          </article>
        </div>
      </section>
    </main>
  </div>

  <input id="photo-file-input" class="visually-hidden" type="file" accept="image/*">

  <script src="http://localhost:9992/static/js/build_managers.js"></script>
</body>
</html>
