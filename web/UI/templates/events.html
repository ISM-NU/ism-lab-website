<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISM Lab | Events</title>
  <link rel="icon" href="http://localhost:9992/static/icons/favicon.png">
  <link rel="stylesheet" href="http://localhost:9992/static/css/events.css">
</head>
<body>
  <div class="stars"></div>
  <div class="nebula"></div>

  <div class="page-shell">
    <header class="page-header">
      <a class="brand" href="http://localhost:9992/" aria-label="ISM Lab Home">
        <div class="logo" aria-hidden="true"></div>
        <div class="title">
          <strong>Interstellar Medium (ISM) Lab</strong>
          <span>Events</span>
        </div>
      </a>
    </header>

    <main class="page-layout visitor-layout">
      <aside class="tools-panel" aria-label="Page controls">
        <a class="toolbox-button" href="http://localhost:9992/participants/">See participants</a>
        <a class="toolbox-button" href="http://localhost:9992/">Go back to home</a>
      </aside>
      <section class="content-panel" aria-labelledby="events-title">
        <div class="section-heading">
          <p class="kicker">Lab calendar</p>
          <h1 id="events-title">Events</h1>
        </div>
        <div id="events-list" class="scroll-list" aria-live="polite">
          <article class="data-card loading-card"><h2>Loading events</h2></article>
        </div>
      </section>
    </main>
  </div>

  <script src="http://localhost:9992/static/js/build_events.js"></script>
</body>
</html>
