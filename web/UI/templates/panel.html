<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISM Lab | Control Panel</title>
  <link rel="icon" href="http://localhost:9992/static/icons/favicon.png">
  <link rel="stylesheet" href="http://localhost:9992/static/css/panel.css">
</head>
<body>
  <div class="stars"></div>
  <div class="nebula"></div>

  <div class="panel-shell">
    <header class="panel-header">
      <a class="brand" href="http://localhost:9992/" aria-label="ISM Lab Home">
        <div class="logo" aria-hidden="true"></div>
        <div class="title">
          <strong>Interstellar Medium (ISM) Lab</strong>
          <span>Control panel</span>
        </div>
      </a>

      <div class="panel-actions">
        <div class="session-chip">
          <span class="dot" aria-hidden="true"></span>
          Active session
        </div>
        <a class="logout-button" href="http://localhost:9992/control/panel/personal/">Personal page</a>
        <button id="logout-button" class="logout-button" type="button">Logout</button>
      </div>
    </header>

    <main class="panel-layout">
      <nav class="toolbox" aria-label="Control panel sections">
        <a class="toolbox-button" href="http://localhost:9992/control/panel/managers/">Managers</a>
        <a class="toolbox-button" href="http://localhost:9992/control/panel/events/">Events</a>
        <a class="toolbox-button" href="http://localhost:9992/control/panel/participants/">Participants</a>
        <a class="toolbox-button" href="http://localhost:9992/control/panel/members/">Members</a>
        <a class="toolbox-button" href="http://localhost:9992/control/panel/projects/">Projects</a>
        <a class="toolbox-button" href="http://localhost:9992/control/panel/announcements/">Announcements</a>
        <a class="toolbox-button" href="http://localhost:9992/control/panel/publications/">Publications</a>
        <a class="toolbox-button" href="http://localhost:9992/control/panel/datasets/">Datasets</a>
      </nav>

      <section class="activity-panel" aria-labelledby="activity-title">
        <div class="section-heading">
          <p class="kicker">Announcements and events</p>
          <h1 id="activity-title">Lab activity</h1>
        </div>
        <div id="activity-feed" class="activity-feed" aria-live="polite">
          <article class="activity-card">
            <span class="activity-kind">Loading</span>
            <h2>Loading lab activity</h2>
          </article>
        </div>
      </section>

      <aside class="users-panel" aria-labelledby="active-users-title">
        <div class="section-heading compact">
          <p class="kicker">Signed in now</p>
          <h2 id="active-users-title">Active users</h2>
        </div>
        <div id="active-users" class="active-users" aria-live="polite">
          <p class="muted">Loading active users</p>
        </div>
      </aside>
    </main>
  </div>

  <script src="http://localhost:9992/static/js/build_panel.js"></script>
</body>
</html>
