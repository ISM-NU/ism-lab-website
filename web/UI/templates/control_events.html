<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISM Lab | Control Events</title>
  <link rel="icon" href="http://localhost:9992/static/icons/favicon.png">
  <link rel="stylesheet" href="http://localhost:9992/static/css/control_events.css">
</head>
<body>
  <div class="stars"></div>
  <div class="nebula"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div class="page-shell">
    <header class="page-header">
      <a class="brand" href="http://localhost:9992/" aria-label="ISM Lab Home">
        <div class="logo" aria-hidden="true"></div>
        <div class="title">
          <strong>Interstellar Medium (ISM) Lab</strong>
          <span>Events control</span>
        </div>
      </a>
      <div class="panel-actions">
        <div class="session-chip"><span class="dot" aria-hidden="true"></span>Active session</div>
        <button id="logout-button" class="logout-button" type="button">Logout</button>
      </div>
    </header>

    <main class="page-layout">
      <aside class="tools-panel" aria-label="Event controls">
        <button id="show-create-form" class="toolbox-button primary-tool" type="button">Create new event</button>
        <a class="toolbox-button" href="http://localhost:9992/control/panel/">Go back to control panel</a>
      </aside>

      <section class="content-panel" aria-labelledby="events-title">
        <div class="section-heading">
          <p class="kicker">Control panel</p>
          <h1 id="events-title">Events</h1>
        </div>
        <div id="events-list" class="scroll-list" aria-live="polite">
          <article class="data-card loading-card"><h2>Loading events</h2></article>
        </div>
      </section>
    </main>
  </div>

  <div id="event-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="event-modal-title">
    <form id="event-form" class="modal-card">
      <div class="modal-head">
        <h2 id="event-modal-title">Create event</h2>
        <button class="small-action subtle" type="button" data-close-modal>Close</button>
      </div>
      <div class="form-grid">
        <label>Title<input name="event_title" type="text" required></label>
        <label>Place<input name="event_place" type="text" required></label>
        <label>Start date<input name="event_start_date" type="date" required></label>
        <label>Start time<input name="event_start_time" type="time" required></label>
        <label>Finish date<input name="event_finish_date" type="date" required></label>
        <label>Finish time<input name="event_finish_time" type="time" required></label>
        <label>Announcement date<input name="announcement_date" type="date" required></label>
        <label>Announcement time<input name="announcement_time" type="time" required></label>
        <label>Registration finish date<input name="registration_finish_date" type="date" required></label>
        <label>Registration finish time<input name="registration_finish_time" type="time" required></label>
        <label class="wide">Registration link<input name="registration_link" type="url" required></label>
      </div>
      <div class="editor-tools" aria-label="Description formatting">
        <button class="small-action" type="button" data-format="h2">Heading</button>
        <button class="small-action" type="button" data-format="bold">Bold</button>
        <button class="small-action" type="button" data-format="italic">Italic</button>
        <button class="small-action" type="button" id="insert-photo-button">Photo</button>
      </div>
      <label class="description-label">Description<textarea name="event_description" rows="10" required></textarea></label>
      <div id="photo-preview" class="photo-preview"></div>
      <div class="form-actions">
        <button class="small-action primary-tool" type="submit">Save event</button>
        <button class="small-action subtle" type="button" data-close-modal>Cancel</button>
      </div>
    </form>
  </div>

  <input id="photo-file-input" class="visually-hidden" type="file" accept="image/*">
  <script src="http://localhost:9992/static/js/build_control_events.js"></script>
</body>
</html>
