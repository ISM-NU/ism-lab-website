<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISM Lab | Control Members</title>
  <link rel="icon" href="http://localhost:9992/static/icons/favicon.png">
  <link rel="stylesheet" href="http://localhost:9992/static/css/control_members.css">
</head>
<body>
  <div class="stars"></div>
  <div class="nebula"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div class="members-shell">
    <header class="members-header">
      <a class="brand" href="http://localhost:9992/" aria-label="ISM Lab Home">
        <div class="logo" aria-hidden="true"></div>
        <div class="title">
          <strong>Interstellar Medium (ISM) Lab</strong>
          <span>Members control</span>
        </div>
      </a>
      <div class="panel-actions">
        <div class="session-chip"><span class="dot" aria-hidden="true"></span>Active session</div>
        <button id="logout-button" class="logout-button" type="button">Logout</button>
      </div>
    </header>

    <main class="members-layout">
      <aside class="members-tools" aria-label="Member controls">
        <button id="show-create-form" class="toolbox-button primary-tool" type="button">Create new member</button>
        <a class="toolbox-button" href="http://localhost:9992/control/panel/">Go back to control panel</a>

        <form id="create-member-form" class="member-form hidden" autocomplete="off">
          <h2>Create member</h2>
          <label>First name<input name="first_name" type="text" required></label>
          <label>Last name<input name="last_name" type="text" required></label>
          <label>Current year of study<input name="current_year_of_study" type="number" min="0" step="1" required></label>
          <label>Currently studying<input name="currently_studying" type="text" required></label>
          <label>Degree<input name="degree" type="text" required></label>
          <label>Join date<input name="join_date" type="date" required></label>
          <label>Email<input name="email" type="email" required></label>
          <label>Additional description<textarea name="additional_description" rows="4"></textarea></label>
          <div class="form-actions">
            <button class="small-action primary-tool" type="submit">Create</button>
            <button class="small-action subtle" type="button" data-close-create>Cancel</button>
          </div>
        </form>
      </aside>

      <section class="members-panel" aria-labelledby="members-title">
        <div class="section-heading">
          <p class="kicker">Control panel</p>
          <h1 id="members-title">Members</h1>
        </div>
        <div id="members-list" class="members-list" aria-live="polite">
          <article class="member-card loading-card"><h2>Loading members</h2></article>
        </div>
      </section>
    </main>
  </div>

  <input id="photo-file-input" class="visually-hidden" type="file" accept="image/*">
  <script src="http://localhost:9992/static/js/build_control_members.js"></script>
</body>
</html>
