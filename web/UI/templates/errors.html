<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ .ErrorCode }} | ISM Lab</title>
  <link rel="stylesheet" href="http://localhost:9992/static/css/errors.css">
</head>

<body>
  <div class="stars"></div>
  <div class="nebula"></div>

  <main class="wrap">
    <section class="card" aria-label="General Error Page">
      <div class="inner">
        <div>
          <div class="brand">
            <div class="logo" aria-hidden="true"></div>
            <div class="t">
              <strong>Interstellar Medium (ISM) Lab</strong>
              <span>Astronomy • Observations • Data Analysis</span>
            </div>
          </div>

          <div class="code">{{ .ErrorCode }}</div>
          <div class="headline">{{ .OfficialMessage }}</div>
          <p class="explain">{{ .Explanation }}</p>

          <div class="actions">
            <a class="btn primary" href="http://localhost:9992/">
              <span class="icon" aria-hidden="true">
                <!-- Home icon -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M4 11l8-7 8 7v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-9z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                  <path d="M9 22v-7h6v7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              </span>
              Back to Home
            </a>

            <a class="btn" href="http://localhost:9992/projects/">
              <span class="icon" aria-hidden="true">
                <!-- Orbit icon -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z" stroke="currentColor" stroke-width="1.4" opacity="0.7"/>
                  <path d="M4.5 12c0-3.5 3.6-6.3 8-6.3S20.5 8.5 20.5 12s-3.6 6.3-8 6.3-8-2.8-8-6.3z" stroke="currentColor" stroke-width="1.4"/>
                  <path d="M16.8 9.1h.01" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
                </svg>
              </span>
              View Projects
            </a>

            <a class="btn" href="http://localhost:9992/publications/">
              <span class="icon" aria-hidden="true">
                <!-- Paper icon -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M7 3h7l3 3v15a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M14 3v4a2 2 0 0 0 2 2h4" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M8 13h8M8 17h8M8 9h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              </span>
              Publications
            </a>
          </div>
        </div>

        <aside class="art" aria-label="Space illustration">
          <!-- Minimal inline SVG: planet + orbit + stars -->
          <svg viewBox="0 0 420 320" role="img" aria-label="Planet orbit illustration">
            <defs>
              <radialGradient id="bg" cx="35%" cy="25%" r="85%">
                <stop offset="0%" stop-color="rgba(124,243,255,0.22)"/>
                <stop offset="45%" stop-color="rgba(167,139,250,0.16)"/>
                <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
              </radialGradient>
              <radialGradient id="planet" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="rgba(124,243,255,0.95)"/>
                <stop offset="55%" stop-color="rgba(124,243,255,0.28)"/>
                <stop offset="100%" stop-color="rgba(124,243,255,0.08)"/>
              </radialGradient>
              <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="rgba(167,139,250,0.90)"/>
                <stop offset="55%" stop-color="rgba(124,243,255,0.90)"/>
                <stop offset="100%" stop-color="rgba(94,234,212,0.85)"/>
              </linearGradient>
              <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect x="0" y="0" width="420" height="320" fill="url(#bg)"/>

            <!-- stars -->
            <g opacity="0.85">
              <circle cx="55" cy="70" r="1.5" fill="rgba(255,255,255,0.75)"/>
              <circle cx="120" cy="45" r="1" fill="rgba(255,255,255,0.6)"/>
              <circle cx="360" cy="65" r="1.4" fill="rgba(255,255,255,0.7)"/>
              <circle cx="310" cy="35" r="1" fill="rgba(255,255,255,0.55)"/>
              <circle cx="385" cy="140" r="1.2" fill="rgba(255,255,255,0.65)"/>
              <circle cx="70" cy="160" r="1.1" fill="rgba(255,255,255,0.6)"/>
              <circle cx="140" cy="210" r="1.2" fill="rgba(255,255,255,0.65)"/>
              <circle cx="250" cy="250" r="1.1" fill="rgba(255,255,255,0.6)"/>
              <circle cx="360" cy="230" r="1.0" fill="rgba(255,255,255,0.55)"/>
            </g>

            <!-- orbit ring -->
            <ellipse cx="235" cy="165" rx="150" ry="60" fill="none" stroke="url(#ring)" stroke-width="7" opacity="0.75" filter="url(#glow)"/>
            <ellipse cx="235" cy="165" rx="150" ry="60" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5" opacity="0.8"/>

            <!-- planet -->
            <circle cx="210" cy="155" r="70" fill="url(#planet)" filter="url(#glow)"/>
            <circle cx="185" cy="135" r="10" fill="rgba(255,255,255,0.22)"/>
            <circle cx="230" cy="120" r="6" fill="rgba(255,255,255,0.18)"/>

            <!-- small moon -->
            <circle cx="105" cy="180" r="10" fill="rgba(167,139,250,0.85)" filter="url(#glow)"/>

            <!-- sparkle -->
            <g transform="translate(330 125)" opacity="0.9" filter="url(#glow)">
              <path d="M18 0l2.2 10.5L31 13l-10.8 2.5L18 26l-2.2-10.5L5 13l10.8-2.5L18 0z"
                    fill="rgba(255,255,255,0.85)"/>
            </g>
          </svg>

          <div class="hint">
          </div>
        </aside>
      </div>
    </section>
  </main>
</body>
</html>
