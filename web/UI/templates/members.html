<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISM Lab | Members</title>
  <link rel="icon" href="http://localhost:9992/static/icons/favicon.png">
  <link rel="stylesheet" href="http://localhost:9992/static/css/members.css">
</head>
<body>
  <div class="stars"></div>
  <div class="nebula"></div>

  <div class="members-shell">
    <header class="members-header">
      <a class="brand" href="http://localhost:9992/" aria-label="ISM Lab Home">
        <div class="logo" aria-hidden="true"></div>
        <div class="title">
          <strong>Interstellar Medium (ISM) Lab</strong>
          <span>Members</span>
        </div>
      </a>
    </header>

    <main class="members-layout visitor-layout">
      <aside class="members-tools" aria-label="Page controls">
        <a class="toolbox-button" href="http://localhost:9992/">Go back to home</a>
      </aside>
      <section class="members-panel" aria-labelledby="members-title">
        <div class="section-heading">
          <p class="kicker">Lab team</p>
          <h1 id="members-title">Members</h1>
        </div>
        <div id="members-list" class="members-list" aria-live="polite">
          <article class="member-card loading-card"><h2>Loading members</h2></article>
        </div>
      </section>
    </main>
  </div>

  <script src="http://localhost:9992/static/js/build_members.js"></script>
</body>
</html>
