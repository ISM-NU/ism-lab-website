<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISM Lab | Control Panel Login</title>
  <link rel="icon" href="http://localhost:9992/static/icons/favicon.png">
  <link rel="stylesheet" href="http://localhost:9992/static/css/login.css">
</head>
<body>
  <div class="stars"></div>
  <div class="nebula"></div>

  <main class="login-shell" aria-label="Control panel login">
    <a class="brand" href="http://localhost:9992/" aria-label="ISM Lab Home">
      <div class="logo" aria-hidden="true"></div>
      <div class="title">
        <strong>Interstellar Medium (ISM) Lab</strong>
        <span>Control panel access</span>
      </div>
    </a>

    <section class="login-panel">
      <div class="panel-heading">
        <p class="kicker">Administrator and manager login</p>
        <h1>Sign in</h1>
      </div>

      <form id="login-form" class="login-form" method="post" autocomplete="on">
        <div class="field">
          <label for="user-login">Login</label>
          <input id="user-login" name="login" type="text" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="user-password">Password</label>
          <input id="user-password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <p id="login-message" class="form-message" role="status" aria-live="polite"></p>

        <button id="login-submit" class="primary-action" type="submit">Sign in</button>
      </form>

      <noscript>
        <p class="noscript-message">JavaScript is required to sign in to the control panel.</p>
      </noscript>
    </section>
  </main>

  <script src="http://localhost:9992/static/js/build_login.js"></script>
</body>
</html>
